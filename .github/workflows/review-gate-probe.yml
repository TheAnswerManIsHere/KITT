# Temporary probe for KITT #293 build step 1: can GITHUB_TOKEN read branch push
# history from the repository activity API? Deleted with this branch's purpose.
name: review-gate-probe
on:
  push:
    branches: [claude/review-gate-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          q() { echo "=== $1"; gh api -X GET "$1" -H "X-GitHub-Api-Version: 2022-11-28" --paginate --jq '.[] | [.timestamp, .activity_type, .ref, .before[0:7], .after[0:7], .actor.login] | @tsv' 2>&1 | head -60; }
          q "repos/TheAnswerManIsHere/Overhypeme/activity?ref=refs/heads/claude/focused-lamport-6b4827&activity_type=push&per_page=100"
          q "repos/TheAnswerManIsHere/Overhypeme/activity?ref=claude/focused-lamport-6b4827&per_page=100"
          q "repos/TheAnswerManIsHere/KITT/activity?ref=refs/heads/claude/review-gate&per_page=100"
          q "repos/TheAnswerManIsHere/KITT/activity?activity_type=push&per_page=5"
